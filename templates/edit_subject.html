{% extends 'base.html' %}

{% block content %}
<div  class="edit_subject">
<h2>Edit Subject</h2>


<form method="post">
    {% csrf_token %}

    <label>Subject Name:</label>
    <input type="text" name="name" value="{{ subject.name }}" required>

    <br><br>

    <!-- ✅ UPDATE BUTTON -->
    <button type="submit">Update</button>
</form>



<!-- ✅ DELETE BUTTON INSIDE SAME PAGE -->
<form method="post" action="{% url 'delete_subject' subject.id %}">
    {% csrf_token %}
    <button type="submit" class="delete-subject"
        style="background:red; color:white;"
        onclick="return confirm('Are you sure you want to delete this subject?')">
        ❌ Delete Subject
    </button>
</form>

<br>

<a href="{% url 'marks' %}">⬅ Back</a>
</div>
{% endblock %}
