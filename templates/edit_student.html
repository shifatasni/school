{% block content %}


<div class="edit-student">
<h2>Edit Student</h2>

<div class="card p-3 mt-3">

    <!-- ✅ SHOW OLD IMAGE -->
    {% if student.photo %}
        <img src="{{ student.photo.url }}" width="120" style="border-radius:50%; margin-bottom:10px;">
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <button class="btn btn-success">Update Student</button>
    </form>

</div>
</div>
{% endblock %}
