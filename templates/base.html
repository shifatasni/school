{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&display=swap" rel="stylesheet">
      <script src="{% static 'javascript/script.js' %}"></script>
      <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body class="body">

<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">

    <h1 onclick="changeText()" style="font-size: 40px;"
        class="navbar-brand" id="editor" contenteditable="true">
        Navbar
    </h1>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link active" href="{% url 'home' %}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'students' %}">Students</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'attendance' %}">Attendance</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'marks' %}">Marks</a>
        </li>        
      </ul>
    </div>
  </div>
</nav>

<!-- ✅ ONLY ONE BLOCK -->
{% block content %}{% endblock %}

</body>

</html>

<script>
const editor = document.getElementById("editor");

if (localStorage.getItem("savedContent")) {
  editor.innerHTML = localStorage.getItem("savedContent");
}

editor.addEventListener("keydown", function (event) {
  if (event.key === "Enter") {
    event.preventDefault();
    const confirmSave = confirm("Do you want to save the changes?");
    if (confirmSave) {
      const content = editor.innerHTML;
      localStorage.setItem("savedContent", content);
      alert("Changes saved!");
    } else {
      editor.innerHTML = localStorage.getItem("savedContent") || "Navbar";
      alert("Changes discarded.");
    }
  }
});
</script>
