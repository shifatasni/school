{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&display=swap" rel="stylesheet">
      <script src="{% static 'javascript/script.js' %}"></script>
      <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body class="body">

<nav class="navbar navbar-expand-lg bg-body-tertiary" >
  <div class="container-fluid d-flex justify-content-between align-items-center">

    <!-- LEFT: Logo + Title -->
    <div class="d-flex align-items-center">
      <!-- LEFT: Logo + Title -->
<a class="navbar-brand d-flex align-items-center" href="#">
    
    <img id="logoPreview"
         src="{% static 'images/default-logo.png' %}"
         onerror="this.src='https://via.placeholder.com/50?text=Logo'"
         style="height:65px; width:65px; object-fit:cover; margin-right:10px; cursor:pointer;">

    <input type="file" id="logoInput" accept="image/*" hidden>

    <span id="editor" 
          contenteditable="true"
           >
        Enter Your College name
    </span>

</a>
    </div>

    <!-- RIGHT: Menu -->
    <div class="d-flex align-items-center" style="gap:10px;">
      <a class="nav-link px-3" href="{% url 'home' %}">Home</a>
      <a class="nav-link px-3" href="{% url 'students' %}">Students</a>
      <a class="nav-link px-3" href="{% url 'attendance' %}">Attendance</a>
      <a class="nav-link px-3" href="{% url 'marks' %}">Marks</a>
    </div>

  </div>
</nav>

<!-- ✅ ONLY ONE BLOCK -->
{% block content %}{% endblock %}

</body>

</html>

<script>
const editor = document.getElementById("editor");

if (localStorage.getItem("savedContent")) {
  editor.innerHTML = localStorage.getItem("savedContent");
}

editor.addEventListener("keydown", function (event) {
  if (event.key === "Enter") {
    event.preventDefault();
    const confirmSave = confirm("Do you want to save the changes?");
    if (confirmSave) {
      const content = editor.innerHTML;
      localStorage.setItem("savedContent", content);
      alert("Changes saved!");
    } else {
      editor.innerHTML = localStorage.getItem("savedContent") || "Navbar";
      alert("Changes discarded.");
    }
  }
});

const logo = document.getElementById("logoPreview");
const logoInput = document.getElementById("logoInput");

// Load saved logo
const savedLogo = localStorage.getItem("navbarLogo");
if (savedLogo) {
    logo.src = savedLogo;
}

// Click logo → open file picker
logo.addEventListener("click", () => {
    logoInput.click();
});

// When user selects image
logoInput.addEventListener("change", function () {
    const file = this.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
            logo.src = e.target.result;

            // Save to localStorage
            localStorage.setItem("navbarLogo", e.target.result);
        };
        reader.readAsDataURL(file);
    }
});

document.getElementById("logoPreview").onclick = function () {
    document.getElementById("logoInput").click();
};

</script>
