{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
   
    <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&display=swap" rel="stylesheet">
      <script src="{% static 'javascript/script.js' %}"></script>
      <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body class="body">

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container-fluid">

        <!-- Left -->
        <div class="d-flex align-items-center left-side">

            <img id="logoPreview"
                 src="{% static 'images/default-logo.png' %}"
                 class="logo-img">

            <input type="file" id="logoInput" hidden>

            <span id="editor"
                  contenteditable="true"
                  class="college-name">
                Enter Your College Name
            </span>

        </div>

        <!-- Right -->
        <button class="navbar-toggler"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#mobileMenu"
        aria-controls="mobileMenu">

    <span class="navbar-toggler-icon"></span>
</button>

        <div class="collapse navbar-collapse justify-content-end"
     id="navbarMenu">

            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'home' %}">Home</a>
                <a class="nav-link" href="{% url 'students' %}">Students</a>
                <a class="nav-link" href="{% url 'attendance' %}">Attendance</a>
                <a class="nav-link" href="{% url 'marks' %}">Marks</a>
            </div>

        </div>

    </div>
</nav>


<div class="offcanvas offcanvas-end" tabindex="-1" id="mobileMenu">

    <div class="offcanvas-header" style="background-color: #161b24;">
        

        <button type="button"
                class="btn-close"
                data-bs-dismiss="offcanvas">
        </button>
    </div>

    <div class="offcanvas-body">

<div class="navbar-nav">

    <a class="nav-link active" href="{% url 'home' %}">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>
        Home
    </a>

    <a class="nav-link" href="{% url 'students' %}">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        Students
    </a>

    <a class="nav-link" href="{% url 'attendance' %}">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/><path d="M9 15l2 2 4-4"/></svg>
        Attendance
    </a>

    <a class="nav-link" href="{% url 'marks' %}">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a2 2 0 012-2h9l5 5v11a2 2 0 01-2 2H6a2 2 0 01-2-2z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></svg>
        Marks
    </a>

        </div>
    </div>

</div>
<!-- ✅ ONLY ONE BLOCK -->
{% block content %}{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>



</body>



<script>
const editor = document.getElementById("editor");

if (localStorage.getItem("savedContent")) {
  editor.innerHTML = localStorage.getItem("savedContent");
}

editor.addEventListener("keydown", function (event) {
  if (event.key === "Enter") {
    event.preventDefault();
    const confirmSave = confirm("Do you want to save the changes?");
    if (confirmSave) {
      const content = editor.innerHTML;
      localStorage.setItem("savedContent", content);
      alert("Changes saved!");
    } else {
      editor.innerHTML = localStorage.getItem("savedContent") || "Navbar";
      alert("Changes discarded.");
    }
  }
});

const logo = document.getElementById("logoPreview");
const logoInput = document.getElementById("logoInput");

// Load saved logo
const savedLogo = localStorage.getItem("navbarLogo");
if (savedLogo) {
    logo.src = savedLogo;
}

// Click logo → open file picker
logo.addEventListener("click", () => {
    logoInput.click();
});

// When user selects image
logoInput.addEventListener("change", function () {
    const file = this.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
            logo.src = e.target.result;

            // Save to localStorage
            localStorage.setItem("navbarLogo", e.target.result);
        };
        reader.readAsDataURL(file);
    }
});

document.getElementById("logoPreview").onclick = function () {
    document.getElementById("logoInput").click();
};

</script>

</html>
